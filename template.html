<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDCard Retake Lotties — Test Bench</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
/* Inter 3.19 (what Figma renders with); Google Fonts' Inter 4 glyphs miss the Figma screens by a visible margin. */
@font-face{font-family:Inter3;font-weight:400;font-display:block;src:url(https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/files/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter3;font-weight:500;font-display:block;src:url(https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/files/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter3;font-weight:600;font-display:block;src:url(https://cdn.jsdelivr.net/npm/@fontsource/inter@4.5.15/files/inter-latin-600-normal.woff2) format("woff2")}
:root{
  --bg:#f4f5f7; --panel:#fff; --line:#e4e6ea; --line-soft:#eef0f3;
  --ink:#16181d; --ink-2:#5b6270; --ink-3:#8c93a1;
  --accent:#00c1a2; --accent-ink:#008f79;
  --stage:#eceef1;
  --r:14px;
  --shadow:0 1px 2px rgba(16,20,30,.04), 0 6px 20px rgba(16,20,30,.06);
  /* Fixed light UI: every animation paints its own opaque bg plate. */
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
}
.bar-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{font-size:12px;color:var(--ink-3)}

.seg{display:flex;align-items:center;gap:2px;background:var(--stage);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:550;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,20,30,.10)}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;font-weight:550;color:var(--ink);
  transition:border-color .15s, transform .08s;
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#03231d}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
.btn.icon{padding:8px;width:34px;justify-content:center}

/* ---------- card picker ---------- */
.picker{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:16px;margin:0 0 22px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);box-shadow:var(--shadow);
}
.picker-thumb{
  width:168px;aspect-ratio:1.6;border-radius:10px;background:var(--stage);
  border:1px solid var(--line-soft);object-fit:cover;display:block;flex:none;
}
.picker-meta{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.picker-meta small{font-size:11px;font-weight:620;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.picker-meta b{font-size:18px;font-weight:650;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-meta span{font-size:12.5px;color:var(--ink-3)}
.picker-actions{display:flex;align-items:center;gap:8px}

.dd{position:relative}
.dd-btn svg{transition:transform .15s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-menu{
  position:absolute;top:calc(100% + 6px);right:0;z-index:50;width:200px;max-height:360px;overflow:auto;
  margin:0;padding:5px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(16,20,30,.16);transform-origin:top right;animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.dd-menu button{
  display:flex;align-items:center;gap:10px;width:100%;padding:6px;border-radius:8px;text-align:left;font-size:12.5px;font-weight:550;
}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--stage);outline:none}
.dd-menu button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent-ink)}
.dd-menu img{width:48px;height:30px;border-radius:5px;object-fit:cover;flex:none;background:var(--stage);border:1px solid var(--line-soft)}
.dd-menu span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:560px){
  .picker-thumb{width:100%}
  .picker-actions{width:100%}
  .picker-actions .dd{flex:1}
  .picker-actions .dd-btn{width:100%;justify-content:space-between}
}

/* ---------- grid ---------- */
.layout{max-width:1480px;margin:0 auto;padding:22px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}

/* ---------- changelog notes ---------- */
.note-k{display:block;margin:8px 0 2px;font-size:10.5px;font-weight:620;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.note{list-style:none}
.note ol{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.note p{margin:0;font-size:12.5px;color:var(--ink)}
.note p.empty{color:var(--ink-3);font-style:italic}
.note-text{white-space:pre-wrap;margin:6px 0 0!important}
.note-edit{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.note-edit textarea{font:inherit;font-size:12.5px;line-height:1.45;width:100%;min-height:54px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--panel);color:var(--ink)}
.note-edit textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.note-edit small{font-size:11px;color:var(--ink-3);min-height:14px}
.note-edit small.ok{color:var(--accent-ink)}
.note-edit small.err{color:#b42318}
.note ol.detected{color:var(--ink-3);font-size:12px}
.var-dl{display:flex;gap:6px;margin-top:10px}
.var-dl .btn{padding:5px 9px;font-size:12px;text-decoration:none}

.badge{flex:none;font-size:10.5px;font-weight:650;letter-spacing:.02em;padding:2px 7px;border-radius:99px}
.badge.new{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}

.meta-row{display:flex;align-items:baseline;gap:10px;margin:0 0 16px;flex-wrap:wrap}
.meta-row h2{margin:0;font-size:20px;font-weight:660;letter-spacing:-.02em}
.meta-row span{font-size:12.5px;color:var(--ink-3)}
.meta-row{align-items:center}
.ver-dl{margin-left:auto;display:flex;gap:8px}
.ver-dl a{text-decoration:none}
.play-seg{width:max-content;margin:-6px 0 16px}

.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:14px}}

.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .16s, box-shadow .16s, transform .16s;
}
.card:hover{border-color:color-mix(in srgb,var(--ink-3) 55%,transparent);box-shadow:0 2px 4px rgba(16,20,30,.05),0 14px 34px rgba(16,20,30,.10)}

.card-head{display:flex;align-items:center;gap:8px;padding:11px 13px 9px}
.card-title{font-size:13px;font-weight:620;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.pill{
  flex:none;font-variant-numeric:tabular-nums;font-size:11px;font-weight:600;
  padding:3px 8px;border-radius:99px;background:var(--stage);color:var(--ink-2);border:1px solid var(--line-soft);
}

.stage{
  position:relative;background:var(--stage);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  aspect-ratio:654/336;cursor:zoom-in;
}
.stage>div{position:absolute;inset:0}
.stage svg{display:block;width:100%!important;height:100%!important}
.expand{
  position:absolute;top:8px;right:8px;z-index:2;
  width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--panel) 82%, transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);opacity:0;transition:opacity .16s;color:var(--ink-2);
}
.card:hover .expand,.expand:focus-visible{opacity:1}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:10px;padding:10px 12px}
.tbtn{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;
  color:var(--ink);border:1px solid transparent;transition:background .14s,border-color .14s;
}
.tbtn:hover{background:var(--stage)}
.tbtn[aria-pressed="true"]{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tbtn svg{width:16px;height:16px;display:block}

.scrub{
  -webkit-appearance:none;appearance:none;flex:1;min-width:0;height:18px;background:none;cursor:pointer;
}
.scrub::-webkit-slider-runnable-track{
  height:4px;border-radius:99px;
  background:linear-gradient(to right,var(--accent) var(--pct,0%),var(--line) var(--pct,0%));
}
.scrub::-moz-range-track{height:4px;border-radius:99px;background:var(--line)}
.scrub::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
.scrub::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--panel);
  border:2px solid var(--accent);margin-top:-4px;box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:transform .12s;
}
.scrub:active::-webkit-slider-thumb{transform:scale(1.25)}
.scrub::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink-3);flex:none;letter-spacing:-.01em}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;
  background:color-mix(in srgb,#0b0d10 62%,transparent);backdrop-filter:blur(6px);
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}}
.sheet{
  width:min(980px,100%);max-height:100%;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.4);
  animation:rise .22s cubic-bezier(.2,.8,.3,1);
}
.sheet-head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.sheet-head h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.015em;flex:1;min-width:0}
.sheet .stage{cursor:default;border-radius:0}
.sheet .transport{padding:14px 16px;gap:12px}
.sheet .tbtn{width:34px;height:34px}
.sheet .tbtn svg{width:18px;height:18px}
.sheet .time{font-size:12px}
.sheet{width:min(1280px,100%)}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;border-top:1px solid var(--line-soft)}
.sheet-body .stage{border-top:0}
.sheet-head .seg button{padding:4px 10px}

/* Full-window large view (button or "f"): the modal fills the browser window. */
.overlay.full{padding:0}
.overlay.full .sheet{width:100%;height:100%;max-height:none;border-radius:0;border:0;display:flex;flex-direction:column;animation:none}
.overlay.full .sheet-body{flex:1;min-height:0}
.overlay.full .sheet-main,.overlay.full .view{display:flex;flex-direction:column;min-height:0;flex:1}
.overlay.full .view>.stage{flex:1;aspect-ratio:auto}
.overlay.full .allgrid{flex:1;max-height:none;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-content:start}
.overlay.full .vars{max-height:none}
.allgrid{display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:12px;max-height:min(62vh,580px);overflow:auto;background:var(--stage)}
.allgrid figure{margin:0;background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.allgrid .stage{cursor:default;border:0}
.allgrid figcaption{padding:6px 9px;font-size:11.5px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vars{border-left:1px solid var(--line-soft);padding:14px 16px;overflow:auto;max-height:min(70vh,640px)}
.vars-k{display:block;margin:0 0 8px;font-size:10.5px;font-weight:620;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.vars-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:4px}
.var{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line-soft);text-align:left}
.var:hover{border-color:var(--ink-3)}
.var[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.var b{font-size:13px;font-weight:620}
.var small{flex:1;min-width:0;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vars .note{padding:0;border:0}
@media (max-width:860px){
  .sheet-body{grid-template-columns:1fr}
  .vars{border-left:0;border-top:1px solid var(--line-soft);max-height:none}
}

/* ---------- Preview tab: the Figma retake flow (processing → error → drawer) ----------
   Everything inside .pv is 1:1 Figma px on a 375×812 frame; .pv-fit scales it to the window. */
.pv-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.pv-ctl label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:550;color:var(--ink-2)}
.pv-ctl select{font:inherit;color:var(--ink);padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pv-stage{display:flex;justify-content:center}
.pv-fit{flex:none;width:calc(375px*var(--k,1));height:calc(812px*var(--k,1));box-shadow:0 4px 12px 2px rgba(0,0,0,.1)}
.pv{position:relative;width:375px;height:812px;overflow:hidden;background:#fff;transform:scale(var(--k,1));transform-origin:0 0;
  font-family:Inter3,sans-serif;line-height:normal;letter-spacing:0;color:#333}
.pv img{display:block;max-width:none}
.pv-screen{position:absolute;inset:0;background:#fff}
.pv-status{position:absolute;left:0;top:0;width:375px;height:44px;overflow:hidden;background:#fff}
.pv-notch{position:absolute;left:78px;top:-2px;width:219px;height:30px}
.pv-time{position:absolute;left:21px;top:12px;width:54px;height:21px}
.pv-right{position:absolute;left:0;top:0;transform:translate(293.67px,17.33px);width:66.6614px;height:11.336px}   /* translate keeps the sub-pixel offset; left/top snap */
.pv-top{position:absolute;left:0;top:44px;width:375px;height:56px;padding:0 24px;background:#fff;display:flex;align-items:center}
.pv-top>span{flex:1 0 0;display:flex}
.pv-back{width:32px;height:32px;border-radius:100px;background:rgba(5,5,82,.03);display:flex;align-items:center;justify-content:center}
.pv-back img{width:16px;height:16px}
.pv-col{position:absolute;left:24px;top:160px;width:327px;display:flex;flex-direction:column;align-items:center;gap:24px}
.pv-title{font-weight:600;font-size:20px;line-height:28px;text-align:center;white-space:nowrap}
.pv-processing .pv-title{color:#616161}
/* clip-path, not overflow:hidden: Chrome snaps an overflow clip to 203px and drops Figma's .136px edge row. */
.pv-photo{position:relative;flex:none;width:327px;height:203.136px;border-radius:6px;clip-path:inset(0 round 6px);background:#616161}
.pv-img,.pv-tint{position:absolute;left:0;top:0;width:327px;height:231px}
.pv-img{object-fit:cover}
.pv-processing .pv-img,.pv-processing .pv-tint{top:.07px}
.pv-tint{background:rgba(5,5,82,.4)}
.pv-error .pv-tint{background:rgba(200,53,50,.4)}
/* Figma's INSIDE stroke paints above the photo, so it's an overlay, not a border. */
.pv-error .pv-photo::after{content:'';position:absolute;inset:0;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.pv-spin{position:absolute;left:152px;top:91px;width:22px;height:22px}
.pv-spin img{position:absolute;left:0;top:0}
html:not(.shot) .pv-spin{animation:pvspin .8s linear infinite}
@keyframes pvspin{to{transform:rotate(1turn)}}
.pv-badge{position:absolute;left:136px;top:79px;width:56px;height:56px}
.pv-foot{position:absolute;left:0;top:738px;width:375px;height:40px;padding:12px 24px;background:#fff;display:flex;justify-content:center;align-items:center}
.pv-by{display:flex;align-items:center;gap:4px;font-size:10px;line-height:12px;color:#050552;white-space:nowrap}
.pv-by>span:last-child{width:115px}   /* Figma's text box; Chrome's advance is a hair narrower and would shift the centered row */
.pv-shield{width:16px;height:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv-shield img{width:10.6465px;height:12.8px}
.pv-home{position:relative;height:24px;background:#fff}
.pv-screen>.pv-home{position:absolute;left:0;top:778px;width:375px;height:34px}
.pv-home i{position:absolute;left:121px;bottom:8px;width:134px;height:5px;border-radius:100px;background:#000}
.pv-error{opacity:0}
.pv[data-step="error"] .pv-error,.pv[data-step="drawer"] .pv-error{opacity:1}
/* The scrim is the sheet container's own fill, so it slides up with the sheet (Figma smart animate). */
.pv-sheetwrap{position:absolute;left:-4px;top:-7px;width:383px;height:822px;overflow:hidden;background:rgba(0,0,0,0);transform:translateY(822px)}
.pv[data-step="drawer"] .pv-sheetwrap{transform:none;background:rgba(0,0,0,.4)}
.pv.pv-anim .pv-error{transition:opacity .3s cubic-bezier(0,0,.58,1)}
.pv.pv-anim .pv-sheetwrap{transition:transform .8s cubic-bezier(.3,-.05,.7,-.5),background-color .8s cubic-bezier(.3,-.05,.7,-.5)}
.pv-sheet{position:absolute;left:4px;top:469px;width:375px;display:flex;flex-direction:column}
.pv-sheet-body{border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column}
.pv-head{height:56px;padding:16px 0;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 -1px 0 rgba(5,5,82,.1)}
.pv-head-t{position:relative;top:.5px;font-weight:600;font-size:18px;line-height:22px;white-space:nowrap}   /* Figma's "auto" line height sits the glyphs .5px lower */
.pv-speak{position:relative;flex:none;width:28px;height:28px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px rgba(5,5,82,.1)}
.pv-speak img{position:absolute;left:4.5px;top:4px;width:20px;height:20px}
.pv-media{padding:16px 24px;background:#fff;display:flex;flex-direction:column;align-items:center}
.pv-lottie{position:relative;width:325px;height:166px;border-radius:12px;overflow:hidden;background:#f4f4f4;box-shadow:0 0 0 1px #e9e9e9}
.pv-lottie svg{display:block}
.pv-btns{padding:12px 20px;background:#fff;box-shadow:inset 0 1px 0 #e6e6e6}
.pv-btn span{position:relative;top:.5px;left:-.5px}   /* matches Figma's 88×17 label box at 143.5,743.5 */
.pv-btn{height:48px;padding:10px;border-radius:6px;background:#554ef1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;line-height:17px}

/* ?shot=processing|error|drawer: the bare 375×812 frame at 1:1, for pixel diffs against Figma. */
html.shot body{background:#fff;overflow:hidden}
html.shot .bar,html.shot .picker,html.shot .pv-ctl{display:none}
html.shot .layout{padding:0;margin:0}
html.shot .pv-stage{display:block}
html.shot .pv-fit{--k:1;box-shadow:none}

.hint{margin:18px 0 0;font-size:12px;color:var(--ink-3);text-align:center}
.hint kbd{font:inherit;font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--panel)}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <div class="brand">
      <h1>IDCard Retake Lotties</h1>
      <span id="sub">— animations</span>
    </div>

    <div class="seg" role="group" aria-label="View" id="tabs">
      <button data-tab="anims" aria-pressed="true">Animations</button>
      <button data-tab="preview" aria-pressed="false">Preview</button>
    </div>

    <div class="seg" role="group" aria-label="Loop" id="loopSeg">
      <button id="loopAll" aria-pressed="true">Loop all</button>
    </div>
  </div>
</div>

<div class="layout">
<main>
  <section class="picker" aria-label="Card image">
    <img id="thumb" class="picker-thumb" alt="">
    <div class="picker-meta">
      <small>Card image</small>
      <b id="imgName">Placeholder card</b>
      <span><span id="imgDim">generated</span> · <span id="imgHint">pick a sample card, or drop an image anywhere</span></span>
    </div>
    <div class="picker-actions">
      <div class="dd">
        <button class="btn dd-btn" id="sampleBtn" aria-haspopup="listbox" aria-expanded="false">
          Sample cards
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <ul class="dd-menu" id="sampleMenu" role="listbox" aria-label="Sample cards" hidden></ul>
      </div>
      <button class="btn primary" id="apply" disabled>Apply to all</button>
      <button class="btn icon" id="reset" title="Reset to placeholder" aria-label="Reset to placeholder">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>
  </section>
  <section id="tabAnims">
  <div class="meta-row">
    <h2>Animations</h2>
    <span>Latest version of each. Click one for its version history.</span>
    <div class="ver-dl" id="verDl"></div>
  </div>
  <div class="seg play-seg" role="group" aria-label="Playback">
    <button id="playAll">Play all</button>
    <button id="pauseAll">Pause all</button>
  </div>
  <div class="grid" id="grid"></div>
  <p class="hint">In the large view: <kbd>space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> step a frame · <kbd>f</kbd> full screen · <kbd>esc</kbd> close</p>
  </section>
  <section id="tabPreview" hidden>
    <div class="pv-ctl">
      <label>Animation <select id="pvAnim"></select></label>
      <label>Version <select id="pvVer"></select></label>
      <button class="btn primary" id="pvPlay">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>Play
      </button>
      <div class="seg" role="group" aria-label="Jump to screen" id="pvJump">
        <button data-step="processing">Processing</button>
        <button data-step="error">Error</button>
        <button data-step="drawer">Drawer</button>
      </div>
    </div>
    <div class="pv-stage"><div class="pv-fit"><div class="pv" id="pv" data-step="processing"></div></div></div>
  </section>

</div>

<script>
const DATA = /*__ANIMS__*/null;          // {anims:[{name, versions:[{v,data,json,lottie,note,what}]}] (newest first), downloads, default, samples}
for (const a of DATA.anims) for (const ver of a.versions) { ver.name = a.name; ver.anim = a; }

/* ---------------- image plumbing ---------------- */

/* Draw a source image into exactly w×h using cover-crop, so the uploaded
   picture keeps its aspect ratio inside the Lottie's fixed asset box. */
function cover(img, w, h){
  /* Rasterise at the source's own resolution (up to 4×), not at the asset's w×h.
     lottie-web sizes the <image> from the asset's w/h, so the extra pixels only add
     sharpness when the preview is scaled up (large view, full screen, retina). */
  const s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  const k = Math.min(4, Math.max(1, 1 / s));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const x = c.getContext('2d');
  x.imageSmoothingQuality = 'high';
  const dw = img.naturalWidth * s * k, dh = img.naturalHeight * s * k;
  x.drawImage(img, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
  return c.toDataURL('image/png');
}

/* Neutral stand-in for the missing card.png — a generic ID card. */
function placeholderCard(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), u = w / 100;
  x.fillStyle = '#e7e9ec'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#d3d7dd'; x.fillRect(6*u, 18*u, 26*u, 34*u);           // photo
  x.fillStyle = '#d9dde2';
  [[38,20,48],[38,30,40],[38,40,44],[6,62,86],[6,72,62]].forEach(([lx,ly,lw]) =>
    x.fillRect(lx*u, ly*u, lw*u, 5*u));
  return c.toDataURL('image/png');
}

/* glare.png is also absent from the archives — synthesise the streak. */
function placeholderGlare(w, h){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, h, w, 0);
  g.addColorStop(0,   'rgba(255,255,255,0)');
  g.addColorStop(.40, 'rgba(255,255,255,0)');
  g.addColorStop(.50, 'rgba(255,255,255,.55)');
  g.addColorStop(.60, 'rgba(255,255,255,0)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  return c.toDataURL('image/png');
}

const state = { img: null, loopAll: true };
const cache = new Map();                       // "src|id@wxh" -> dataURI

/* Only the `card` asset takes the picked image; other missing assets (the old
   glare.png) keep their placeholder. The key includes the image src, so a
   newly applied card never reuses an earlier card's crop. */
function assetURI(a, pick){
  const img = a.id === 'card' ? pick : null;
  const key = (img ? img.src : 'placeholder') + '|' + a.id + '@' + a.w + 'x' + a.h;
  if (!cache.has(key))
    cache.set(key, img ? cover(img, a.w, a.h)
            : a.id === 'glare' ? placeholderGlare(a.w * 3, a.h * 3)
            : placeholderCard(a.w * 3, a.h * 3));   // 3× so it stays crisp when scaled up
  return cache.get(key);
}

/* Inline every image asset as a data URI so nothing is fetched at runtime. */
function withImage(def, img = state.img){
  const d = structuredClone(def.data);
  for (const a of d.assets || []) {
    if (a.p === undefined || a.id === undefined || !a.w || a.p.startsWith('data:')) continue;
    a.p = assetURI(a, img); a.u = ''; a.e = 1;
  }
  return d;
}

/* ---------------- per-animation player ---------------- */

const fmt = s => s.toFixed(2) + 's';
const ICON = {
  play:  '<path d="M7 4.5v15l13-7.5z"/>',
  pause: '<path d="M7 4.5h4v15H7zM14 4.5h4v15h-4z"/>',
  stop:  '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
  loop:  '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 12v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 12v1a4 4 0 0 1-4 4H3"/></g>'
};
const svg = p => `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${p}</svg>`;

/* Builds the play / loop / scrubber row and binds it to a lottie instance.
   `loopBtn:false` for the modal, which inherits the card's loop setting. */
function transport(host, get, opts = {}){
  const el = document.createElement('div');
  el.className = 'transport';
  el.innerHTML =
    `<button class="tbtn" data-act="play" aria-label="Play">${svg(ICON.pause)}</button>` +
    `<button class="tbtn" data-act="stop" aria-label="Stop">${svg(ICON.stop)}</button>` +
    (opts.loopBtn === false ? '' :
      `<button class="tbtn" data-act="loop" aria-label="Loop" aria-pressed="true">${svg(ICON.loop)}</button>`) +
    `<input class="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Timeline">` +
    `<span class="time">0.00s</span>`;
  host.appendChild(el);

  const playBtn = el.querySelector('[data-act="play"]');
  const loopBtn = el.querySelector('[data-act="loop"]');
  const scrub   = el.querySelector('.scrub');
  const time    = el.querySelector('.time');

  let queued = false;
  const api = {
    el, scrub,
    /* enterFrame fires 60x/s per animation; coalesce into one paint. */
    sync(){
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => { queued = false; api.draw(); });
    },
    draw(){
      const a = get(); if (!a) return;
      const total = a.totalFrames;
      const f = Math.min(a.currentFrame, total);
      scrub.max = Math.max(1, Math.round(total));
      if (document.activeElement !== scrub || a.isPaused === false) scrub.value = f;
      scrub.style.setProperty('--pct', (f / total * 100) + '%');
      time.textContent = fmt(f / a.frameRate) + ' / ' + fmt(total / a.frameRate);
      playBtn.innerHTML = svg(a.isPaused ? ICON.play : ICON.pause);
      playBtn.setAttribute('aria-label', a.isPaused ? 'Play' : 'Pause');
      if (loopBtn) loopBtn.setAttribute('aria-pressed', String(a.loop));
    }
  };

  playBtn.onclick = () => {
    const a = get();
    if (!a.isPaused) a.pause();
    else if (a.currentFrame >= a.totalFrames - 1) a.goToAndPlay(0, true);
    else a.play();
    api.draw();
  };
  el.querySelector('[data-act="stop"]').onclick = () => { get().goToAndStop(0, true); api.draw(); };
  if (loopBtn) loopBtn.onclick = () => { opts.onLoop(!get().loop); api.draw(); };

  scrub.addEventListener('input', () => {
    const a = get();
    a.goToAndStop(+scrub.value, true);
    api.draw();
  });
  return api;
}

let cards = [];
function build(anims){
  closeSheet();
  cards.forEach(c => c.anim.destroy());
  document.getElementById('grid').replaceChildren();
  cards = anims.map(def => {
  const total = def.data.op - def.data.ip;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    `<div class="card-head">
       <span class="card-title"></span>
       <span class="pill" title="${def.anim.versions.length} version${def.anim.versions.length > 1 ? 's' : ''}">${def.v}</span>
       <span class="pill">${fmt(total / def.data.fr)}</span>
     </div>
     <div class="stage">
       <div class="mount"></div>
       <button class="expand" aria-label="Open large">
         <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
       </button>
     </div>`;
  card.querySelector('.card-title').textContent = def.name;
  document.getElementById('grid').appendChild(card);

  const mount = card.querySelector('.mount');
  const c = { def, loop: state.loopAll, anim: null, ui: null };

  c.ui = transport(card, () => c.anim, {
    onLoop(v){ c.loop = v; c.anim.loop = v; if (v && c.anim.isPaused) c.anim.play(); }
  });

  c.load = () => {
    const wasPaused = c.anim && c.anim.isPaused;
    if (c.anim) c.anim.destroy();
    c.anim = lottie.loadAnimation({
      container: mount, renderer: 'svg', loop: c.loop, autoplay: !wasPaused,
      animationData: withImage(def),
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet', progressiveLoad: false }
    });
    c.anim.addEventListener('enterFrame', c.ui.sync);
    c.anim.addEventListener('complete', c.ui.sync);
    c.anim.addEventListener('DOMLoaded', c.ui.sync);
  };
  c.load();

  const open = () => openSheet(c);
  card.querySelector('.stage').onclick = e => { if (!e.target.closest('.transport')) open(); };
  return c;
  });
  document.getElementById('sub').textContent = cards.length + ' animations';
}

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* Editing only works through serve.py (local). Any static host (Vercel, Pages) 404s /__edit, so viewers never see edit controls. */
let EDIT = false;
async function saveNote(body){
  const r = await fetch('__notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
}

/* Free-text changelog field. Locally: an always-editable textarea that saves when it loses focus
   (or ⌘/Ctrl+Enter). Hosted: plain text. save(text) returns a promise. */
function noteField(get, save, placeholder){
  if (!EDIT) { const t = get(); return t ? el('p', 'note-text', t) : el('p', 'note-text empty', placeholder); }
  const box = el('div', 'note-edit'), ta = el('textarea'), status = el('small');
  ta.value = get() || '';
  ta.placeholder = placeholder;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  ta.oninput = () => { status.textContent = 'Unsaved'; status.className = ''; fit(); };
  ta.onchange = async () => {
    status.textContent = 'Saving…';
    try { await save(ta.value); status.textContent = 'Saved'; status.className = 'ok'; }
    catch (e) { status.textContent = 'Not saved: ' + e.message; status.className = 'err'; }
  };
  ta.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ta.blur(); };
  box.append(ta, status);
  requestAnimationFrame(fit);
  return box;
}

const older = def => def.anim.versions[def.anim.versions.indexOf(def) + 1];

/* One version's changelog note, the changes build.py detected vs the version before it, and its downloads. */
function versionNote(def, onSaved){
  const li = el('li', 'note'), prev = older(def);
  li.appendChild(noteField(() => def.note, note => saveNote({ name: def.name, version: def.v, note }).then(() => { def.note = note.trim(); onSaved?.(); }),
    'No changelog note for ' + def.v + ' yet.'));
  li.appendChild(el('span', 'note-k', prev ? 'Detected vs ' + prev.v : 'First version'));
  if (prev) {
    const ol = el('ol', 'detected');
    def.what.forEach(w => ol.appendChild(el('li', null, w)));
    li.appendChild(ol);
  }
  const dl = el('div', 'var-dl');
  for (const [label, href] of [['JSON', def.json], ['dotLottie', def.lottie]]) {
    if (!href) continue;
    const a = el('a', 'btn', '↓ ' + label);
    a.href = href; a.download = def.name + ' ' + def.v + (label === 'JSON' ? '.json' : '.lottie');
    dl.appendChild(a);
  }
  li.appendChild(dl);
  return li;
}

/* ---------------- large view ---------------- */

let sheet = null;

/* Several lottie instances driven as one, so the transport and keyboard
   controls work unchanged in the All cards view. Reads come from the first. */
function group(anims){
  const g = anims.g = {
    get isPaused(){ return anims[0].isPaused; }, get currentFrame(){ return anims[0].currentFrame; },
    get totalFrames(){ return anims[0].totalFrames; }, get frameRate(){ return anims[0].frameRate; },
    get loop(){ return anims[0].loop; }, set loop(v){ anims.forEach(a => a.loop = v); },
    addEventListener: (ev, fn) => anims[0].addEventListener(ev, fn)
  };
  for (const m of ['play', 'pause', 'goToAndStop', 'goToAndPlay', 'destroy']) g[m] = (...args) => anims.forEach(a => a[m](...args));
  return g;
}

const samples = new Map();
const sampleImg = p => {
  if (!samples.has(p)) samples.set(p, new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = p; }));
  return samples.get(p);
};

/* Large view. The right panel lists this animation's variations across
   versions; picking one swaps the preview in place and shows its notes. */
function openSheet(c){
  closeSheet();
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML =
    `<div class="sheet" role="dialog" aria-modal="true">
       <div class="sheet-head">
         <h3></h3>
         <div class="seg" role="group" aria-label="Card images">
           <button data-mode="one">One card</button>
           <button data-mode="all">All cards</button>
         </div>
         <span class="pill"></span>
         <button class="btn icon" data-full aria-label="Full screen" title="Full screen (f)"></button>
         <button class="btn icon" data-close aria-label="Close">
           <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
         </button>
       </div>
       <div class="sheet-body">
         <div class="sheet-main"><div class="view"></div></div>
         <aside class="vars" aria-label="Versions"><span class="vars-k">Versions</span><ul class="vars-list"></ul><div class="vars-note"></div></aside>
       </div>
     </div>`;
  document.body.appendChild(o);
  sheet = { o, anim: null, ui: null, card: c };
  const fullBtn = o.querySelector('[data-full]');
  sheet.setFull = on => {
    state.full = on;
    o.classList.toggle('full', on);
    fullBtn.setAttribute('aria-pressed', String(on));
    fullBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
    fullBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
      (on ? '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>' : '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>') + '</svg>';
  };
  sheet.setFull(!!state.full);
  fullBtn.onclick = () => sheet.setFull(!state.full);

  const list = o.querySelector('.vars-list'), view = o.querySelector('.view');
  let cur = c.def, token = 0;
  const show = async def => {
    cur = def;
    const t = ++token, mode = state.mode || 'one', all = mode === 'all';
    o.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    const imgs = all ? await Promise.all(DATA.samples.map(sampleImg)) : [state.img];
    if (t !== token || sheet?.o !== o) return;          // a newer switch (or close) won the race
    if (sheet.anim) sheet.anim.destroy();
    const d = def.data, total = d.op - d.ip;
    o.querySelector('h3').textContent = def.name + ' · ' + def.v;
    o.querySelector('.pill').textContent = `${d.w}×${d.h} · ${Math.round(total)}f @ ${d.fr}fps · ${fmt(total / d.fr)}`;
    list.querySelectorAll('.var').forEach(b => b.setAttribute('aria-pressed', String(b.def === def)));
    o.querySelector('.vars-note').replaceChildren(el('span', 'vars-k', 'Changelog · ' + def.v),
      versionNote(def, () => { const b = [...list.querySelectorAll('.var')].find(b => b.def === def); if (b) b.querySelector('small').textContent = firstLine(def); }));
    view.replaceChildren();
    const grid = all ? view.appendChild(el('div', 'allgrid')) : view;
    const anims = imgs.map((img, i) => {
      const stage = el('div', 'stage'), mount = stage.appendChild(el('div'));
      if (all) {
        const fig = grid.appendChild(el('figure'));
        fig.append(stage, el('figcaption', null, DATA.samples[i].split('/').pop().replace(/\.png$/, '')));
      } else grid.appendChild(stage);
      return lottie.loadAnimation({
        container: mount, renderer: 'svg', loop: c.loop, autoplay: !all,
        animationData: withImage(def, img),
        rendererSettings: { preserveAspectRatio: 'xMidYMid meet' }
      });
    });
    sheet.anim = all ? group(anims) : anims[0];
    if (all) Promise.all(anims.map(a => a.isLoaded ? 0 : new Promise(r => a.addEventListener('DOMLoaded', r))))
      .then(() => { if (sheet?.anim === anims.g) anims.g.goToAndPlay(0, true); });   // start together
    for (const ev of ['enterFrame', 'complete', 'DOMLoaded']) sheet.anim.addEventListener(ev, sheet.ui.sync);
  };
  o.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; show(cur); });

  const firstLine = def => (def.note || '').split('\n')[0];
  for (const def of c.def.anim.versions) {
    const b = el('button', 'var');
    b.def = def;
    b.append(el('b', null, def.v), el('small', null, firstLine(def)));
    if (def === c.def.anim.versions[0]) b.appendChild(el('span', 'badge new', 'Latest'));
    b.onclick = () => show(def);
    const li = el('li'); li.appendChild(b); list.appendChild(li);
  }

  sheet.ui = transport(o.querySelector('.sheet-main'), () => sheet?.anim, {   // a queued redraw can land after close
    onLoop(v){ c.loop = v; sheet.anim.loop = v; c.anim.loop = v; c.ui.sync();
               if (v && sheet.anim.isPaused) sheet.anim.play(); }
  });
  show(c.def);
  o.onclick = e => { if (e.target === o || e.target.closest('[data-close]')) closeSheet(); };
}

function closeSheet(){
  if (!sheet) return;
  sheet.anim.destroy();
  sheet.o.remove();
  sheet = null;
}

addEventListener('keydown', e => {
  if (!sheet || e.target.closest('textarea')) return;
  const a = sheet.anim;
  if (e.key === 'Escape') closeSheet();
  else if (e.key === 'f' && !e.metaKey && !e.ctrlKey) sheet.setFull(!state.full);
  else if (e.key === ' ') { e.preventDefault(); a.isPaused ? a.play() : a.pause(); sheet.ui.sync(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    a.goToAndStop(Math.max(0, Math.min(a.totalFrames, a.currentFrame + (e.key === 'ArrowRight' ? 1 : -1))), true);
    sheet.ui.sync();
  }
});

/* ---------------- global controls ---------------- */

const reloadAll = () => {
  const reopen = sheet && sheet.card;
  closeSheet();
  cards.forEach(c => c.load());
  if (reopen) openSheet(reopen);
  if (pv.anim) pvLoad(!pv.anim.isPaused);
};

document.getElementById('playAll').onclick  = () => cards.forEach(c => { c.anim.play();  c.ui.sync(); });
document.getElementById('pauseAll').onclick = () => cards.forEach(c => { c.anim.pause(); c.ui.sync(); });

const loopAllBtn = document.getElementById('loopAll');
loopAllBtn.onclick = () => {
  state.loopAll = !state.loopAll;
  loopAllBtn.setAttribute('aria-pressed', String(state.loopAll));
  cards.forEach(c => {
    c.loop = state.loopAll; c.anim.loop = state.loopAll;
    if (state.loopAll && c.anim.isPaused) c.anim.play();
    c.ui.sync();
  });
};

const thumb = document.getElementById('thumb');
const applyBtn = document.getElementById('apply');
const hint = document.getElementById('imgHint');
const HINT = 'pick a sample card, or drop an image anywhere';

/* Selecting a card only previews it in the panel; Apply re-renders the animations. */
function preview(src, name){
  const img = new Image();
  img.onload = () => {
    state.pending = img;
    thumb.src = img.src;
    document.getElementById('imgName').textContent = name;
    document.getElementById('imgDim').textContent = img.naturalWidth + '×' + img.naturalHeight;
    hint.textContent = 'not applied yet';
    applyBtn.disabled = false;
  };
  img.src = src;
}

applyBtn.onclick = () => {
  state.img = state.pending; state.pending = null;
  hint.textContent = HINT;
  applyBtn.disabled = true;
  reloadAll();
};

const sampleBtn = document.getElementById('sampleBtn');
const sampleMenu = document.getElementById('sampleMenu');
const toggleMenu = open => {
  sampleMenu.hidden = !open;
  sampleBtn.setAttribute('aria-expanded', String(open));
  if (open) (sampleMenu.querySelector('[aria-selected="true"]') || sampleMenu.querySelector('button')).focus();
};
const markSample = p => sampleMenu.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.src === p)));

for (const p of DATA.samples) {
  const name = p.split('/').pop().replace(/\.png$/, '');
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.setAttribute('role', 'option'); b.dataset.src = p;
  b.innerHTML = '<img loading="lazy" alt=""><span></span>';
  b.querySelector('img').src = p;
  b.querySelector('span').textContent = name;
  b.onclick = () => { markSample(p); toggleMenu(false); sampleBtn.focus(); preview(p, name); };
  li.appendChild(b); sampleMenu.appendChild(li);
}
sampleBtn.onclick = () => toggleMenu(sampleMenu.hidden);
addEventListener('click', e => { if (!sampleMenu.hidden && !e.target.closest('.dd')) toggleMenu(false); });
sampleMenu.addEventListener('keydown', e => {
  const items = [...sampleMenu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  else if (e.key === 'Escape') { e.stopPropagation(); toggleMenu(false); sampleBtn.focus(); }
});

/* Default card: the production card (IDCARDS/default.*, see build.py) when present, else the generated placeholder. */
let DEFAULT_IMG = null;
function useDefault(){
  state.img = DEFAULT_IMG; state.pending = null; markSample(DATA.default);
  hint.textContent = HINT; applyBtn.disabled = true;
  document.getElementById('imgName').textContent = DEFAULT_IMG ? 'Default card' : 'Placeholder card';
  document.getElementById('imgDim').textContent = DEFAULT_IMG ? DEFAULT_IMG.naturalWidth + '×' + DEFAULT_IMG.naturalHeight : 'generated';
  thumb.src = DEFAULT_IMG ? DEFAULT_IMG.src : placeholderCard(184, 120);
}
document.getElementById('reset').onclick = () => { useDefault(); reloadAll(); };
document.getElementById('reset').title = document.getElementById('reset').ariaLabel = DATA.default ? 'Reset to default card' : 'Reset to placeholder';
document.getElementById('verDl').replaceChildren(...DATA.downloads.map(d => {
  const a = el('a', 'btn', '↓ ' + d.label);
  a.href = d.href; a.download = '';
  return a;
}));
(DATA.default ? sampleImg(DATA.default) : Promise.resolve(null)).then(img => {
  DEFAULT_IMG = img; useDefault();
  if (SHOT) return pvShot();
  build(DATA.anims.map(a => a.versions[0]));
  setTab(location.hash === '#preview' ? 'preview' : 'anims');
});
fetch('__edit').then(r => { if (r.status === 204) EDIT = true; }).catch(() => {});

/* ---------------- Preview tab: the Figma retake flow ----------------
   Screens 1123:14315 (processing) → 1123:14385 (error) → 1123:14440 (drawer), built 1:1 in Figma px.
   The captured photo is Figma's sample; only the drawer's Lottie takes the picked card. */

const PV = 'preview/assets/';
const pvChrome = () =>
  `<div class="pv-status"><img class="pv-notch" src="${PV}notch.svg" alt=""><img class="pv-time" src="${PV}status-time.svg" alt="9:41"><img class="pv-right" src="${PV}status-right.svg" alt=""></div>
   <div class="pv-top"><span><span class="pv-back"><img src="${PV}arrow-left.svg" alt="Back"></span></span><span></span><span></span></div>
   <div class="pv-foot"><span class="pv-by"><span class="pv-shield"><img src="${PV}security.svg" alt=""></span><span>powered by HyperVerge</span></span></div>
   <div class="pv-home"><i></i></div>`;
const pvScreen = (cls, title, overlay) =>
  `<div class="pv-screen ${cls}">${pvChrome()}
     <div class="pv-col"><div class="pv-title">${title}</div>
       <div class="pv-photo"><img class="pv-img" src="${PV}img-2611.png" alt=""><i class="pv-tint"></i>${overlay}</div></div>
   </div>`;

const pv = { root: document.getElementById('pv'), anim: null, step: 'processing', timers: [] };
pv.root.innerHTML =
  pvScreen('pv-processing', 'Processing...', `<span class="pv-spin"><img src="${PV}spinner-track.svg" alt=""><img src="${PV}spinner-arc.svg" alt=""></span>`) +
  pvScreen('pv-error', 'There seems to be an issue', `<img class="pv-badge" src="${PV}error-56.svg" alt="">`) +
  `<div class="pv-sheetwrap"><div class="pv-sheet" role="dialog">
     <div class="pv-sheet-body">
       <div class="pv-head"><span class="pv-head-t"></span><span class="pv-speak"><img src="${PV}volume-up.svg" alt="Play audio"></span></div>
       <div class="pv-media"><div class="pv-lottie"></div></div>
       <div class="pv-btns"><span class="pv-btn"><span>Retake Selfie</span></span></div>
     </div>
     <div class="pv-home"><i></i></div>
   </div></div>`;

const pvAnimSel = document.getElementById('pvAnim'), pvVerSel = document.getElementById('pvVer');
for (const a of DATA.anims) pvAnimSel.add(new Option(a.name));
if (DATA.anims.some(a => a.name === 'PartialID')) pvAnimSel.value = 'PartialID';   // the animation in the Figma drawer
const pvVersions = () => {
  const a = DATA.anims.find(a => a.name === pvAnimSel.value);
  pvVerSel.replaceChildren(...a.versions.map((v, i) => new Option(v.v + (i ? '' : ' (latest)'), i)));
};
pvVersions();
const pvDef = () => DATA.anims.find(a => a.name === pvAnimSel.value).versions[+pvVerSel.value];

function pvLoad(play){
  const def = pvDef();
  if (pv.anim) pv.anim.destroy();
  pv.root.querySelector('.pv-head-t').textContent = { ...DATA.errors._default, ...DATA.errors[def.name] }.title;
  return pv.anim = lottie.loadAnimation({
    container: pv.root.querySelector('.pv-lottie'), renderer: 'svg', loop: true, autoplay: play,
    animationData: withImage(def, state.img),
    rendererSettings: { preserveAspectRatio: 'xMidYMid slice' }   // canvas is 2× the box incl. its stroke ring
  });
}

/* `animate` turns on the Figma transitions; without it a step change is instant. */
function pvStep(step, animate){
  pv.step = step;
  pv.root.classList.toggle('pv-anim', !!animate);
  pv.root.dataset.step = step;
  document.querySelectorAll('#pvJump button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.step === step)));
}
const pvStop = () => { pv.timers.forEach(clearTimeout); pv.timers = []; };

/* Figma prototype: after 0.8 s dissolve to error (300 ms ease-out); 0.75 s after that settles,
   slide the sheet up (800 ms ease-in-back); the Lottie starts once it lands. */
function pvPlay(){
  pvStop();
  if (pv.anim) { pv.anim.destroy(); pv.anim = null; }
  pvStep('processing');
  pv.root.offsetWidth;                                  // commit the reset before transitions are re-enabled
  const at = (ms, fn) => pv.timers.push(setTimeout(fn, ms));
  at(800, () => { pvStep('error', true); pvLoad(false); });
  at(800 + 300 + 750, () => pvStep('drawer', true));
  at(800 + 300 + 750 + 800, () => { pv.timers = []; pv.anim.goToAndPlay(0, true); });
}

function pvJump(step){
  pvStop();
  pvStep(step);
  if (step === 'drawer') pvLoad(true);
  else if (pv.anim) pv.anim.goToAndStop(0, true);
}

/* Scale the 375×812 frame to fit the window below the picker and controls (at scroll 0); never upscale. */
function pvFit(){
  const top = pv.root.parentElement.parentElement.getBoundingClientRect().top + scrollY;
  pv.root.parentElement.style.setProperty('--k', Math.max(.5, Math.min(1, (innerHeight - top - 24) / 812)));
}

pvAnimSel.onchange = () => { pvVersions(); pvVerSel.onchange(); };
pvVerSel.onchange = () => { if (pv.anim) pvLoad(pv.step === 'drawer' && !pv.timers.length); };
document.getElementById('pvPlay').onclick = pvPlay;
document.querySelectorAll('#pvJump button').forEach(b => b.onclick = () => pvJump(b.dataset.step));
addEventListener('resize', () => { if (state.tab === 'preview') pvFit(); });

/* Top-level tabs. Grid animations pause while Preview is showing and resume on return. */
function setTab(tab){
  if (tab === state.tab) return;
  state.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === tab)));
  document.getElementById('tabAnims').hidden = tab !== 'anims';
  document.getElementById('tabPreview').hidden = tab !== 'preview';
  document.getElementById('loopSeg').hidden = tab !== 'anims';
  history.replaceState(null, '', tab === 'preview' ? '#preview' : location.pathname + location.search);
  if (tab === 'preview') {
    cards.forEach(c => { c.resume = !c.anim.isPaused; c.anim.pause(); c.ui.sync(); });
    pvFit();
    pvPlay();
  } else {
    pvStop();
    if (pv.anim) pv.anim.pause();
    cards.forEach(c => { if (c.resume) c.anim.play(); c.ui.sync(); });
  }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ?shot=processing|error|drawer[&anim=&v=&frame=]: one static screen at 1:1; sets html[data-ready] when painted. */
const SHOT = new URLSearchParams(location.search).get('shot');
if (SHOT) document.documentElement.classList.add('shot');
function pvShot(){
  const q = new URLSearchParams(location.search);
  if (q.get('anim')) { pvAnimSel.value = q.get('anim'); pvVersions(); }
  const vi = pvDef().anim.versions.findIndex(v => v.v === q.get('v'));
  if (vi >= 0) pvVerSel.value = vi;
  document.getElementById('tabAnims').hidden = true;
  document.getElementById('tabPreview').hidden = false;
  pvStep(SHOT);
  let lottieReady = null;
  if (SHOT === 'drawer') {
    const a = pvLoad(false);
    lottieReady = new Promise(r => a.addEventListener('DOMLoaded', () => { a.goToAndStop(+q.get('frame') || 0, true); r(); }));
  }
  Promise.all([document.fonts.ready, ...[...pv.root.querySelectorAll('img')].map(i => i.decode().catch(() => {})), lottieReady])
    .then(() => requestAnimationFrame(() => { document.documentElement.dataset.ready = 1; }));
}

/* drop an image anywhere on the page */
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/'));
  if (!f) return;
  e.preventDefault();
  markSample(null);
  preview(URL.createObjectURL(f), f.name);
});
</script>
